name: Data

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write # rolling releases data-<region>
  packages: write # <region> images

concurrency:
  group: data
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ls-itsolutions/open-property-location

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # The smoke test location must have a train station with lines
          # within 500 m, and departures if the region has a GTFS feed.
          # Thresholds are about half of the November 2026 builds;
          # paediatricians are rarely tagged outside Germany, Austria and
          # Switzerland.
          - name: germany
            title: Germany
            geofabrik: europe/germany
            smoke: 52.5219 13.4132 # Berlin Alexanderplatz
            gtfs: https://download.gtfs.de/germany/free/latest.zip
            gtfs_attribution: DELFI e.V. via gtfs.de, CC BY 4.0
          - name: austria
            title: Austria
            geofabrik: europe/austria
            smoke: 48.1851 16.3777 # Wien Hauptbahnhof
            min_size_mb: 10
            min_per_category: 50
          - name: switzerland
            title: Switzerland
            geofabrik: europe/switzerland
            smoke: 47.3779 8.5403 # Zürich HB
            # One feed per timetable year, see the build step.
            gtfs: https://data.opentransportdata.swiss/dataset/timetable-{year}-gtfs2020/permalink
            gtfs_attribution: opentransportdata.swiss
            min_size_mb: 10
            min_per_category: 50
          - name: netherlands
            title: Netherlands
            geofabrik: europe/netherlands
            smoke: 52.3789 4.9003 # Amsterdam Centraal
            gtfs: https://gtfs.ovapi.nl/nl/gtfs-nl.zip
            gtfs_attribution: OVapi (gtfs.ovapi.nl), CC0
            min_size_mb: 30
            min_per_category: 2
          - name: denmark
            title: Denmark
            geofabrik: europe/denmark
            smoke: 55.6727 12.5649 # København H
            min_size_mb: 8
            min_per_category: 4
          - name: italy
            title: Italy
            geofabrik: europe/italy
            smoke: 41.9009 12.5013 # Roma Termini
            min_size_mb: 60
            min_per_category: 50
          - name: spain
            title: Spain
            geofabrik: europe/spain
            smoke: 40.4066 -3.6894 # Madrid Puerta de Atocha
            min_size_mb: 45
            min_per_category: 15
          - name: croatia
            title: Croatia
            geofabrik: europe/croatia
            smoke: 45.8045 15.9787 # Zagreb Glavni kolodvor
            min_size_mb: 5
            min_per_category: 4
    env:
      REGION: ${{ matrix.name }}
      TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool sqlite3
      - name: Build data
        env:
          GEOFABRIK: ${{ matrix.geofabrik }}
          GTFS: ${{ matrix.gtfs }}
          GTFS_ATTRIBUTION: ${{ matrix.gtfs_attribution }}
        run: |
          if [[ $GTFS == *'{year}'* ]]; then
            # The next year's timetable is published about a month before
            # the change in December; until then use this year's.
            year=$(date +%Y)
            for y in $((year + 1)) "$year"; do
              if curl -sfL -r 0-0 -o /dev/null "${GTFS//\{year\}/$y}"; then
                GTFS=${GTFS//\{year\}/$y}
                break
              fi
            done
          fi
          if [[ -n $GTFS ]]; then
            scripts/build-data.sh "$GEOFABRIK" out "$GTFS" "$GTFS_ATTRIBUTION"
          else
            scripts/build-data.sh "$GEOFABRIK" out
          fi
          echo "DATA_VERSION=$(cat out/data-version)" >> "$GITHUB_ENV"
          df -h .
      - name: Smoke test
        env:
          SMOKE: ${{ matrix.smoke }}
          REQUIRE_DEPARTURES: ${{ matrix.gtfs && '1' || '' }}
        run: |
          go build -o opl ./cmd/opl
          read -r lat lon <<< "$SMOKE"
          REQUIRE_LINES=1 scripts/smoke-test.sh ./opl out/places.db "$lat" "$lon" train_station 500
      - name: Check size and counts
        env:
          MIN_SIZE_MB: ${{ matrix.min_size_mb }}
          MIN_PER_CATEGORY: ${{ matrix.min_per_category }}
        run: scripts/check-data.sh out/places.db
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --target with-data \
            --build-context data=out --push \
            -t "$IMAGE:$REGION" -t "$IMAGE:$REGION-$DATA_VERSION" .
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="data-$REGION"
          notes="OpenStreetMap data for $TITLE as of $DATA_VERSION. © OpenStreetMap contributors, ODbL 1.0 (see LICENSE-DATA)."
          if ! gh release view "$release" > /dev/null 2>&1; then
            gh release create "$release" --title "Data: $TITLE" --notes "$notes" --latest=false
          fi
          gh release upload "$release" out/places.db LICENSE-DATA --clobber
          gh release edit "$release" --notes "$notes" --latest=false

  # Keeps one open issue while the weekly build fails, and closes it once a
  # build passes again.
  report:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or close issue
        run: |
          open=$(gh issue list --label data-build --state open --json number --jq '.[0].number // empty')
          if [[ $RESULT == success ]]; then
            if [[ -n $open ]]; then gh issue close "$open" --comment "Passing again: $RUN_URL"; fi
          elif [[ -n $open ]]; then
            gh issue comment "$open" --body "Still failing: $RUN_URL"
          else
            gh label create data-build --color d93f0b --description "Weekly data build" --force
            gh issue create --label data-build --title "Weekly data build failed" \
              --body "The data workflow failed, so the images and data releases were not updated: $RUN_URL"
          fi
