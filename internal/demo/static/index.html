<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPropertyLocation demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<h1>OpenPropertyLocation</h1>

<form id="search">
  <input name="address" required autocomplete="off" aria-label="Address">
  <select name="preset" aria-label="Preset">
    <option>stay</option>
    <option>living</option>
  </select>
  <button>Search</button>
</form>

<p id="status" role="status"></p>
<div id="results"></div>

<footer>
  Data <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, ODbL</a>.
  Walking times are estimates.
</footer>
</body>
</html>
